# Example site configuration. Copy to config/<site>.yaml and adjust.
# Input paths are read in place (read-only); outputs go to work/<site>/.
site: siteA
crs: EPSG:25832          # projected CRS of LAS, TMS coordinates and logger table
vertical_crs: null       # LAS height datum: null = ellipsoidal (DJI Terra without geoid model); EPSG:7837 = DHHN2016
                         # (then the geoid grid de_bkg_gcg2016.tif must be in data/external/proj/, see README)

inputs:
  laz:
    - /path/to/site/lidars/terra_las/cloud_merged.laz
  trajectory: /path/to/site/lidars/terra_las/sbet.out   # DJI Terra trajectory export (enable it in Terra)
  trajectory_format: auto
  ortho: /path/to/site/ortho.tif
  ortho_time: "2025-07-15T09:30:00Z"                     # UTC, for `voxsol validate`
  # TMS data and logger table: with a `database` section both default to the snapshot written by
  # `voxsol db` (work/<site>/db/). Without one, give a long-format file:
  tms: null                # e.g. /path/to/site/tms_long.csv with x, y, timestamp, value, height
  tms_columns: {x: x, y: y, time: timestamp, value: value, height: height}
  tms_timezone: UTC
  loggers: null            # optional CSV: x, y [, id, z (RTK ground height), xy_sd, reference]

database:                  # PostgreSQL (schema docs/db/schema.sql); connection: scripts/db.sh set ...
  service: voxsol          # libpq service in secrets/pg_service.conf
  versuchsflaeche: SA      # site: id, short, safe or clean name (`voxsol db --check` lists them)
  behandlungseinheiten: [] # optional treatment filter (short names); [] = all loggers of the site
  met_source: null         # externe_daten.met_points.source; null = the only one linked
  skip_days_after_start: 1 # drop the installation day of every deployment
  exclude_locality_quality: []   # e.g. [unsicher]: drop deployments with this locality_id_quality
  xy_sd_by_quality: {}     # logger position sd [m] per locality_id_quality (else prepare.logger_xy_sd)
  ghi_label: auto          # hourly GHI time stamp: end (Open-Meteo) | start | instant | auto (clear-sky check)

period:                    # logger campaign; drives sun geometry, forcing and maps
  start: 2025-05-01
  end: 2025-09-30

buffer_m: 40               # map edge buffer (low sun rays need surrounding scan coverage)

prepare:
  ground: csf              # csf | las_class (use DJI Terra's class 2)
  sor: true
  csf_cloth_resolution: 0.5
  csf_rigidness: 2         # 1 = steep terrain, 3 = flat
  csf_class_threshold: 0.3
  logger_xy_sd: 0.05       # default position sd [m] when the logger table has none

grid:
  dx: 0.25
  dz: 0.25
  zmax: 40.0
  h_cut: 1.0               # 3D canopy above, calibrated understory below
  dtm_res: 0.25

voxel:
  pulse_min: 5
  g_leaf: 0.5
  sigma_leaf: 0.0

trace:
  map_res: 0.5
  sun_bin_deg: 1.0
  n_sky: 400
  logger_disk_n: 25
  understory_k: 0.5        # only for the uncalibrated first-guess maps
  sensor_heights: [0.02, 0.15]

understory:
  ortho_res: null          # ortho read resolution [m]; null = native (exact). The ortho is streamed in blocks,
                           # peak memory ~0.8 GB whatever its size; coarser values only save CPU time
  ortho_block_px: 2000000  # pixels per block (~150 bytes each); lower it on machines with little RAM

forcing:
  radiation: cams          # cams | db (ERA5 GHI from the database, Erbs split) | era5 (needs time_step 1h) | clearsky
  time_step: 15min
  reference: db            # db (ERA5 t2m from the database) | era5land | loggers | file
  reference_loggers: []    # logger ids used when reference = loggers (or flag them in the logger table)
  reference_file: null     # CSV: time, t2m, skt, stl1 [deg C], UTC
  reference_grid_elevation: null   # ERA5-Land cell elevation [m] -> lapse-rate correction to the site

horizon:
  dem: null                # external DEM covering the site +- max_dist_m, 10-30 m (Copernicus GLO-30 / state DGM)
  dem_res: 10.0
  max_dist_m: 20000

calibration:               # read by R/run_calibration.R
  # sensor -> TMS height label(s); compared without spaces/"cm", "air" = above ground, "soil" = below,
  # so "15" == "air 15 cm" and "-8" == "soil 8 cm". Database labels:
  sensors: {T3: "air 15 cm", T2: "air 2 cm", T1: "soil 8 cm", VWC: "soil 0-15 cm"}
  reference_vars: {T3: t2m, T2: t2m, T1: t2m}   # reference: db has t2m only (era5land also has stl1, skt)
  responses: [T3, T2, T1]
  stats: [max, mean]
  us_candidates: [us_index_15cm, us_index_2cm, ground_lift, ground_roughness, rgb_exg]
  static_covariates: [rgb_green_cover]
  cv_folds: 0              # 0 = leave-one-logger-out
