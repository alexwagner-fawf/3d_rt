# Copy to secrets/pg_service.conf (gitignored), or run:  scripts/db.sh set HOST DBNAME USER
# libpq service file, used by voxsol (psycopg), psql and R: DBI::dbConnect(RPostgres::Postgres(), service = "voxsol")
# The password goes to secrets/pgpass (mode 600), one line per server:  host:port:dbname:user:password
# Comments must be on their own lines (libpq does not strip trailing comments).
[voxsol]
host=db.example.local
port=5432
dbname=forschung
user=your_db_user
# prefer = TLS if the server offers it; with a checked server certificate behind TLS inspection use
# sslmode=verify-full and sslrootcert=/path/to/corp-root-ca.pem
sslmode=prefer
